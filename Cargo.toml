[package]
name = "sextant-machines"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
description = "Bounded desired-state reconciliation with conditional writes"
readme = "README.md"
categories = ["no-std"]
repository = "https://github.com/seuros/sextant_machines"
exclude = [".github/", ".release-please-manifest.json", "release-please-config.json"]

[dependencies]
periscope-machines = { version = ">=0.5", default-features = false }

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unused_must_use = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
